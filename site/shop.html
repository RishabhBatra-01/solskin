<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all — SOLSKIN</title>
<meta name="description" content="Four products and the tools to apply them. Every bundle listed once, with the saving measured against what the parts actually cost.">
<link rel="stylesheet" href="css/styles.css?v=1788000725638">
<link rel="stylesheet" href="css/store.css?v=1788000725638">
</head>
<body>

<!-- the ground tans as you choose — see "THE PAGE DEVELOPS" in store.css -->
<div class="develop" aria-hidden="true"></div>

<header class="store-nav">
  <div class="store-nav__in">
    <a href="index.html" aria-label="SOLSKIN home"><img src="logo/solskin-wordmark-cream.svg" alt="SOLSKIN" width="118" height="36"></a>
    <nav aria-label="Store">
      <ul class="store-nav__links">
        <li><a href="shop.html" aria-current="page" style="color:var(--bronze-lit)">Shop</a></li>
        <li><a href="picker.html">Find your shade</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Shop all</h1>
    <p>Four products and the tools to apply them. Every bundle appears <strong>once</strong>, under one name, and the saving is measured against what the parts actually cost.</p>
  </div>

  <div class="rail">
    <p class="rail__label" id="raillbl">How far do you want to go?</p>
    <div class="rail__track" role="group" aria-labelledby="raillbl">
      <button class="rail__step" data-d="subtle"     aria-pressed="false"><i style="background:#DDB68F"></i><span>Just a bit<small>A good week, nothing more</small></span></button>
      <button class="rail__step" data-d="noticeable" aria-pressed="false"><i style="background:#C89A6B"></i><span>A proper tan<small>Obvious, still you</small></span></button>
      <button class="rail__step" data-d="deep"       aria-pressed="false"><i style="background:#8A5A34"></i><span>Deep bronze<small>Holiday skin</small></span></button>
      <button class="rail__step" data-d="any"        aria-pressed="true"><i style="background:linear-gradient(135deg,#DDB68F,#8A5A34)"></i><span>Show me everything<small>All four</small></span></button>
    </div>
  </div>

  <div class="filters" role="group" aria-label="Filter products">
    <button class="filter" data-f="all" aria-pressed="true">Everything</button>
    <button class="filter" data-f="body" aria-pressed="false">Body</button>
    <button class="filter" data-f="face" aria-pressed="false">Face</button>
    <button class="filter" data-f="noTan" aria-pressed="false">No-tan glow</button>
    <button class="filter" data-f="tools" aria-pressed="false">Tools</button>
    <button class="filter" data-f="bundle" aria-pressed="false">Bundles</button>
  </div>

  <div class="grid" id="grid"></div>
  <p aria-live="polite" id="count" style="color:var(--ivory-faint);font-size:.86rem;margin-top:2rem"></p>
</main>

<script src="js/catalogue.js?v=1788000725638"></script>
<script>
/* Collection page. ~1KB of logic: filter, render, announce.
   Filter state lives in the URL so a filtered view is linkable. */
(function () {
  'use strict';
  var grid = document.getElementById('grid');
  var count = document.getElementById('count');

  function cards() {
    var out = [];
    PRODUCTS.forEach(function (p) {
      out.push({ cat: p.cat, depth: p.depth, html:
        '<article class="card" style="--shade:' + SHADES[p.variants[0].shade].hex + '">' +
        '<div class="card__img"><span class="card__tilt"></span><img src="' + p.img + '" alt="SOLSKIN ' + p.name +
        '" loading="lazy" width="230" height="248"></div><div class="card__body">' +
        '<h3>' + p.name + '</h3><span class="card__meta">' + p.size + '</span>' +
        '<div class="shades">' + p.variants.map(function (v) {
          return '<button class="shade-chip" type="button" data-shade="' + SHADES[v.shade].hex +
                 '" title="' + v.label + '"><i class="shade-dot" style="background:' + SHADES[v.shade].hex +
                 '"></i><span>' + v.label + '</span></button>';
        }).join('') + '</div>' +
        '<p class="card__blurb">' + p.blurb + '</p>' +
        '<div class="card__foot"><span class="card__price">' + money(p.price) + '</span>' +
        '<a class="btn btn--ghost" style="padding:8px 16px;font-size:.82rem" href="picker.html">Which shade?</a></div>' +
        '</div></article>' });
    });
    TOOLS.forEach(function (t) {
      out.push({ cat: t.cat, html:
        '<article class="card"><div class="card__img" style="background:var(--charcoal-2)"></div><div class="card__body">' +
        '<h3>' + t.name + '</h3><p class="card__blurb">Application matters more than the tan. This is why it goes on evenly.</p>' +
        '<div class="card__foot"><span class="card__price">' + money(t.price) + '</span></div></div></article>' });
    });
    BUNDLES.forEach(function (b) {
      var full = partsTotal(b), save = full - b.price;
      out.push({ cat: ['bundle'], html:
        '<article class="card" style="--shade:' + SHADES[byId(b.base).variants[0].shade].hex + '">' +
        '<div class="card__img"><span class="card__tilt"></span><img src="' + byId(b.base).img + '" alt="SOLSKIN ' + b.name +
        '" loading="lazy" width="230" height="248"></div><div class="card__body">' +
        '<h3>' + b.name + '</h3><span class="card__meta">' + b.parts.map(function (id) { return byId(id).name; }).join(' + ') + '</span>' +
        '<p class="card__blurb">One listing, one price. The saving is against what these cost bought separately.</p>' +
        '<div class="card__foot"><span class="card__price">' + money(b.price) +
        ' <span class="card__was">' + money(full) + '</span></span>' +
        '<span class="card__save">Save ' + money(save) + '</span></div></div></article>' });
    });
    return out;
  }

  var ALL = cards();
  var depth = 'any';

  function render(f) {
    var list = f === 'all' ? ALL : ALL.filter(function (c) { return c.cat.indexOf(f) !== -1; });
    if (depth !== 'any') list = list.filter(function (c) { return !c.depth || c.depth.indexOf(depth) !== -1; });
    grid.innerHTML = list.length ? list.map(function (c) { return c.html; }).join('')
                                 : '<p class="empty">Nothing in that group yet.</p>';
    count.textContent = list.length + (list.length === 1 ? ' product' : ' products');
    document.querySelectorAll('.filter').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.f === f));
    });
  }

  /* the depth rail also tans the page — the ground deepens with the
     choice, which is the one thing here that only works for this brand */
  document.querySelector('.rail__track').addEventListener('click', function (e) {
    var b = e.target.closest('.rail__step');
    if (!b) return;
    depth = b.dataset.d;
    document.querySelectorAll('.rail__step').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x.dataset.d === depth));
    });
    var r = document.documentElement;
    if (depth === 'any') { r.removeAttribute('data-depth'); r.setAttribute('data-develop', '1'); }
    else { r.setAttribute('data-depth', depth); r.removeAttribute('data-develop'); }
    render(current);
  });

  document.querySelector('.filters').addEventListener('click', function (e) {
    var b = e.target.closest('.filter');
    if (!b) return;
    history.replaceState(null, '', b.dataset.f === 'all' ? location.pathname : '#' + b.dataset.f);
    current = b.dataset.f;
    render(current);
  });

  /* Tilt: a few degrees following the cursor. Sets two custom properties
     and nothing else — no layout, no repaint, composited on the GPU.
     Skipped entirely on touch and under reduced motion. */
  var fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (fine && !still) {
    grid.addEventListener('pointermove', function (e) {
      var card = e.target.closest('.card');
      if (!card) return;
      var t = card.querySelector('.card__tilt');
      if (!t) return;
      var r = card.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5;
      var y = (e.clientY - r.top) / r.height - 0.5;
      t.style.setProperty('--ry', (x * 9).toFixed(2) + 'deg');
      t.style.setProperty('--rx', (-y * 6).toFixed(2) + 'deg');
      card.querySelector('.card__img').style.setProperty('--tiltx', x);
    });
    grid.addEventListener('pointerleave', function () {
      grid.querySelectorAll('.card__tilt').forEach(function (t) {
        t.style.setProperty('--ry', '0deg'); t.style.setProperty('--rx', '0deg');
      });
    }, true);
  }

  /* hovering a specific shade chip previews THAT shade on the plinth */
  grid.addEventListener('pointerover', function (e) {
    var chip = e.target.closest('.shade-chip');
    if (!chip) return;
    chip.closest('.card').style.setProperty('--shade', chip.dataset.shade);
  });

  var current = location.hash.replace('#', '') || 'all';
  document.documentElement.setAttribute('data-develop', '1');
  render(current);
})();
</script>
</body>
</html>
